  - id: SRC-GTMF1-004
    type: html-reference
    path: context/gtmf1_revops_redesign_v4.html
    roles:
      - content
      - reference
    authority: user-approved
    processing_status: processed
    received_at: '2026-10-25'
    summary: >-
      User requested analysis and comparison only. Original HTML preserved unchanged
      and reviewed in an isolated local browser preview. V4 uses a nine-section
      dark/gold layout, Salesforce/HubSpot-focused positioning, regrouped services,
      Claude-specific agentic workflows, a 500+ system-build claim, flexible hourly/
      project/ongoing engagements, a 30-minute call offer and a larger contact form.
      The form only prevents submission and displays a success message; no capture,
      sending, storage or booking integration exists. V4 differs from the approved
      forest theme, recent hero/CTA/12-tool-strip revisions, fixed-fee review copy,
      interactive four-role checklist, framework images and other Figma sections.
      After comparison, the user approved selective content adoption while preserving
      the approved design and recent revisions (DEC-009). Relevant CRM, integration,
      reporting and Claude workflow context is now incorporated into existing services,
      AI and FAQ copy. V4's visual redesign, numerical claims, altered commercial offer
      and contact workflow remain unadopted.
